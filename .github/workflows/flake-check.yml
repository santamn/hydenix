name: Flake Check

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  changes:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      nix: ${{ steps.diff.outputs.nix }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: |
          files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" --jq '.files[] | .filename, .previous_filename // empty')
          # Anything outside the docs, the CI config, and the top-level Markdown files can change what the flake builds
          if grep -qvE '^(docs/|\.github/|[^/]+\.md$)' <<<"$files" || grep -qx .github/workflows/flake-check.yml <<<"$files"; then
            echo nix=true >>"$GITHUB_OUTPUT"
          else
            echo nix=false >>"$GITHUB_OUTPUT"
          fi

  check:
    needs: changes
    # Also runs when `changes` fails or is skipped
    if: ${{ !cancelled() && needs.changes.outputs.nix != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Check Root Flake
        run: nix flake check

      - name: Check Template Flake
        run: |
          cd template
          sed -i 's|url = "github:santamn/hydenix"|url = "path:../"|' flake.nix
          nix flake check
          git checkout flake.nix
          rm -f flake.lock
