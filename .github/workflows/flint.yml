name: Flint 🧼

on:
  workflow_dispatch:
  pull_request:

permissions: {}

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      lock: ${{ steps.diff.outputs.lock }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" --jq '.files[] | .filename, .previous_filename // empty')
          if grep -qE '^(flake\.lock|\.github/workflows/flint\.yml)$' <<<"$files"; then
            echo lock=true >>"$GITHUB_OUTPUT"
          else
            echo lock=false >>"$GITHUB_OUTPUT"
          fi

  check-dependencies:
    needs: changes
    # Also runs when `changes` fails or is skipped
    if: ${{ !cancelled() && needs.changes.outputs.lock != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - run: nix run github:NotAShelf/flint -- --fail-if-multiple-versions
