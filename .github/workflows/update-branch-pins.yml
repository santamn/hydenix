name: Update Branch Pins

on:
  workflow_dispatch: # Allows manual triggering
  schedule:
    - cron: "0 0 * * 0" # Run weekly on Sunday at midnight UTC

jobs:
  update-branch-pins:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Fetch all history for auto-merge

      - name: Setup Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Update branch pins
        id: update
        shell: bash
        run: |
          if ! nix run .#update-branch-pins 2>&1 | tee "$RUNNER_TEMP/update-branch-pins.log"; then
            echo failed=true >>"$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        id: create_pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: automated branch pin updates"
          title: "chore: Automated Branch Pin Updates"
          body: |
            This PR moves each branch pin to the head of the branch it tracks and refreshes its `sha256`.
            Automated by GitHub Actions.
          branch: automated-branch-pin-updates
          delete-branch: true
          labels: automated
          add-paths: |
            pkgs/hydenix-themes/*.nix
            pkgs/hyde-diff-upstream/default.nix

      - name: Merge PR
        if: steps.create_pr.outputs.pull-request-number
        run: gh pr merge --auto --rebase "$PR_NUMBER"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pull-request-number }}

      - name: Notify failed pin updates
        if: steps.update.outputs.failed == 'true'
        run: |
          log=$RUNNER_TEMP/update-branch-pins.log
          detail=$(awk '/^could not update:/,0' "$log")
          if [ -n "$detail" ]; then
            message=$(head -n 1 <<<"$detail")
          else
            message='update-branch-pins stopped before reporting; see the tail below or the Update branch pins log'
            detail=$(tail -n 50 "$log")
          fi
          printf '::error title=Branch pin update failed::%s\n' "$message"
          cat >>"$GITHUB_STEP_SUMMARY" <<EOF
          ## Branch pin update failed

          \`\`\`
          $detail
          \`\`\`
          EOF
          exit 1
