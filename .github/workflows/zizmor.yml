name: Zizmor 🌈

on:
  workflow_dispatch:
  pull_request:

permissions: {}

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      actions: ${{ steps.diff.outputs.actions }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" --jq '.files[] | .filename, .previous_filename // empty')
          if grep -qE '^\.github/(workflows/|dependabot\.yml$)' <<<"$files"; then
            echo actions=true >>"$GITHUB_OUTPUT"
          else
            echo actions=false >>"$GITHUB_OUTPUT"
          fi

  zizmor:
    needs: changes
    # Also runs when `changes` fails or is skipped
    if: ${{ !cancelled() && needs.changes.outputs.actions != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Required for upload-sarif (used by zizmor-action) to upload SARIF files.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
